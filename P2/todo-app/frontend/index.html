<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --border: #2e2e2e;
    --accent: #c8ff00;
    --text: #e8e8e8;
    --muted: #666;
    --done: #3a3a3a;
  }

  body {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 16px;
  }

  .app { width: 100%; max-width: 560px; }

  .header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 40px;
  }
  .header h1 { font-size: 28px; font-weight: 600; letter-spacing: -1px; }
  .count { color: var(--accent); font-size: 13px; }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  .add-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .add-row button:hover { opacity: .85; }

  .todo-list { display: flex; flex-direction: column; gap: 6px; }

  .todo {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    transition: border-color .15s;
  }
  .todo:hover { border-color: #444; }

  .todo input[type=checkbox] {
    appearance: none;
    width: 16px; height: 16px;
    border: 1px solid var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .todo input[type=checkbox]:checked { border-color: var(--accent); background: var(--accent); }
  .todo input[type=checkbox]:checked::after {
    content: '';
    position: absolute;
    top: 2px; left: 4px;
    width: 5px; height: 8px;
    border: 2px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  .todo-text {
    flex: 1;
    font-size: 14px;
    transition: color .15s;
  }
  .todo.done .todo-text { color: var(--muted); text-decoration: line-through; }

  .del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
    transition: color .15s;
  }
  .del:hover { color: #ff4444; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>TODO</h1>
    <span class="count" id="count"></span>
  </div>

  <div class="add-row">
    <input id="inp" type="text" placeholder="new task..." maxlength="200">
    <button onclick="addTodo()">ADD</button>
  </div>

  <div class="todo-list" id="list"></div>
</div>

<script>
  const API = (window.API_URL || 'http://localhost:8080') + '/todos';

  async function load() {
    const r = await fetch(API);
    const todos = await r.json();
    render(todos || []);
  }

  function render(todos) {
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    count.textContent = `${todos.filter(t => !t.done).length} left`;
    if (!todos.length) {
      list.innerHTML = '<div class="empty">nothing here yet</div>';
      return;
    }
    list.innerHTML = todos.map(t => `
      <div class="todo ${t.done ? 'done' : ''}" id="t${t.id}">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id}, this.checked)">
        <span class="todo-text">${esc(t.text)}</span>
        <button class="del" onclick="del(${t.id})">×</button>
      </div>
    `).join('');
  }

  async function addTodo() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text) return;
    await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text}) });
    inp.value = '';
    load();
  }

  async function toggle(id, done) {
    await fetch(`${API}/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({done}) });
    load();
  }

  async function del(id) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    load();
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('inp').addEventListener('keydown', e => e.key === 'Enter' && addTodo());
  load();
</script>
</body>
</html>
