services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - db_data:/data/db
    restart: always
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URL: mongodb://mongo:mongo@mongo:27017/notes?authSource=admin
    ports:
      - "8080:8080"
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    volumes:
      - nginx_log:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      - backend

networks:
  webnet:
    driver: bridge

volumes:
  nginx_log:
  db_data:
