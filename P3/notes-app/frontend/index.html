<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Mono', monospace;
    background: #0e0e0e;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 16px;
  }

  .app { width: 100%; max-width: 560px; }

  h1 { font-size: 28px; font-weight: 600; margin-bottom: 32px; letter-spacing: -1px; }
  h1 span { color: #00e5ff; }

  .add-row { display: flex; gap: 8px; margin-bottom: 32px; }

  textarea {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2e2e2e;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    resize: none;
    height: 72px;
    transition: border-color .15s;
  }
  textarea:focus { border-color: #00e5ff; }

  button.add {
    background: #00e5ff;
    color: #000;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 0 16px;
    cursor: pointer;
    align-self: stretch;
    transition: opacity .15s;
  }
  button.add:hover { opacity: .85; }

  .notes { display: flex; flex-direction: column; gap: 6px; }

  .note {
    background: #1a1a1a;
    border: 1px solid #2e2e2e;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .note-text { flex: 1; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

  .note-meta { font-size: 11px; color: #555; margin-top: 6px; }

  button.del {
    background: none;
    border: none;
    color: #444;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    transition: color .15s;
    flex-shrink: 0;
  }
  button.del:hover { color: #ff4444; }

  .empty { color: #555; font-size: 13px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="app">
  <h1>NOTE<span>S</span></h1>

  <div class="add-row">
    <textarea id="inp" placeholder="write something..."></textarea>
    <button class="add" onclick="addNote()">ADD</button>
  </div>

  <div class="notes" id="list"></div>
</div>

<script>
  const API = (window.API_URL || 'http://localhost:8080') + '/notes';

  async function load() {
    const r = await fetch(API);
    const notes = await r.json();
    const list = document.getElementById('list');
    if (!notes.length) {
      list.innerHTML = '<div class="empty">no notes yet</div>';
      return;
    }
    list.innerHTML = notes.map(n => `
      <div class="note">
        <div style="flex:1">
          <div class="note-text">${esc(n.text)}</div>
          <div class="note-meta">${new Date(n.createdAt).toLocaleString()}</div>
        </div>
        <button class="del" onclick="del('${n._id}')">×</button>
      </div>
    `).join('');
  }

  async function addNote() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text) return;
    await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text}) });
    inp.value = '';
    load();
  }

  async function del(id) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    load();
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('inp').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) addNote();
  });

  load();
</script>
</body>
</html>
